# Локальная разработка: только БД в контейнерах, api/web идут через `pnpm dev`
# с hot-reload (04-deployment.md, «Окружения»).
name: wise-crm-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wisecrm
      POSTGRES_USER: wisecrm
      POSTGRES_PASSWORD: wisecrm
      TZ: Europe/Kyiv
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wisecrm']
      interval: 5s
      retries: 10

  # Отдельная БД под API-тесты (09-implementation-plan.md, раздел 5.2).
  # tmpfs вместо тома: между прогонами состояние не нужно, зато TRUNCATE быстрее.
  postgres_test:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wisecrm_test
      POSTGRES_USER: wisecrm
      POSTGRES_PASSWORD: wisecrm
      TZ: Europe/Kyiv
    ports: ['5434:5432']
    tmpfs: [/var/lib/postgresql/data]
    command: ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wisecrm']
      interval: 5s
      retries: 10

volumes:
  pgdata: {}
