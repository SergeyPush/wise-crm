# Поддомен CRM (вариант Г, решение от 26.08.2026). Кладётся рядом с конфигом
# маркетингового сайта. Порядок работ: nginx -t → reload, НИКОГДА не restart.

server {
    listen 80;
    listen [::]:80;
    server_name crm.wisexpert.com.ua;

    # certbot выпускается ДО включения оранжевого облака Cloudflare,
    # иначе HTTP-01-челлендж уходит в редирект-петлю
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Сервер на nginx 1.21.4 (проверено 27.08.2026) — там ещё нет отдельной
    # директивы `http2 on;` (появилась в 1.25.1), синтаксис старый, совмещённый.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.wisexpert.com.ua;

    ssl_certificate     /etc/letsencrypt/live/crm.wisexpert.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.wisexpert.com.ua/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Должно совпадать с лимитом файла из FR-F7: рассинхрон даёт 413
    # без внятной ошибки в интерфейсе
    client_max_body_size 25M;

    access_log /var/log/nginx/crm.access.log;
    error_log  /var/log/nginx/crm.error.log;

    location / {
        # nginx на хосте (проверено 27.08.2026) — контейнер публикует порт
        # только на 127.0.0.1, наружу не торчит (docker-compose.prod.yml)
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # запас на выгрузку XLSX и загрузку документов
        proxy_buffering    off;    # стриминг скачивания файлов
    }
}
