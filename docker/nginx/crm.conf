# Поддомен CRM (вариант Г, решение от 26.08.2026). Кладётся рядом с конфигом
# маркетингового сайта. Порядок работ: nginx -t → reload, НИКОГДА не restart.

server {
    listen 80;
    listen [::]:80;
    server_name crm.wisexpert.com.ua;

    # certbot выпускается ДО включения оранжевого облака Cloudflare,
    # иначе HTTP-01-челлендж уходит в редирект-петлю
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.wisexpert.com.ua;

    ssl_certificate     /etc/letsencrypt/live/crm.wisexpert.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.wisexpert.com.ua/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Должно совпадать с лимитом файла из FR-F7: рассинхрон даёт 413
    # без внятной ошибки в интерфейсе
    client_max_body_size 25M;

    access_log /var/log/nginx/crm.access.log;
    error_log  /var/log/nginx/crm.error.log;

    location / {
        # wise-crm-api — имя контейнера в общей сети web
        proxy_pass http://wise-crm-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
