# Деплой только с зелёного main (NFR-38). Перед миграциями — обязательный
# pg_dump (NFR-36): миграция необратима, откат образа схему не вернёт.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io требует lowercase имя репозитория; github.repository_owner
      # (SergeyPush) идёт как есть и валит buildx на "must be lowercase"
      - name: Нормалізувати власника репозиторію (Docker вимагає lowercase)
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Один образ на релиз: фронт и бэк не могут разъехаться
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/wise-crm:${{ github.sha }}
            ghcr.io/${{ steps.vars.outputs.owner }}/wise-crm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # До этого шага docker-compose.prod.yml и scripts/*.sh на сервере не
      # обновлялись сами — правки в git молча расходились с тем, что реально
      # выполняется (обнаружено 27.08.2026 на первом реальном деплое).
      # .env сюда осознанно не входит: он не в git, только на сервере (chmod 600).
      - name: Синхронизировать compose-файл и скрипты на сервере
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: 'docker-compose.prod.yml,scripts/backup.sh,scripts/restore-test.sh,scripts/pre-deploy-dump.sh'
          target: /opt/wise-crm/
          strip_components: 0

      - name: Деплой по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/wise-crm
            chmod +x scripts/*.sh
            ./scripts/pre-deploy-dump.sh
            export TAG=${{ github.sha }}
            export GH_OWNER=${{ steps.vars.outputs.owner }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
