# Гейты из NFR-38: на PR — линт, typecheck, юнит и API-тесты;
# на merge в main — дополнительно Playwright. Бюджет прогона на PR — 5 минут.
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  TEST_DATABASE_URL: postgresql://wisecrm:wisecrm@localhost:5432/wisecrm_test?schema=public

jobs:
  check:
    name: Лінт, типи, тести
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wisecrm_test
          POSTGRES_USER: wisecrm
          POSTGRES_PASSWORD: wisecrm
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Пакет общих типов и матрицы прав нужен обеим сторонам до любых проверок
      - run: pnpm --filter shared build

      - run: pnpm --filter api exec prisma generate

      - name: Лінт
        run: pnpm lint

      - name: Перевірка типів
        run: pnpm typecheck

      - name: Юніт-тести
        run: pnpm test:unit

      - name: API-тести (справжній Postgres, не моки)
        run: pnpm --filter api test:api

  e2e:
    name: Playwright
    # Только на main: UI-тесты самые медленные, на каждом PR они не окупаются
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check

    services:
      postgres_test:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wisecrm_test
          POSTGRES_USER: wisecrm
          POSTGRES_PASSWORD: wisecrm
        ports: ['5434:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # playwright.config.ts сам поднимает API (миграции + сиды + seed-dev)
      # и фронт через webServer — здесь только то, что ему нужно передать
      TEST_DATABASE_URL: postgresql://wisecrm:wisecrm@localhost:5434/wisecrm_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shared build
      - run: pnpm --filter api exec prisma generate

      - run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
